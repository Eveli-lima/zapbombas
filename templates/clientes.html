{% extends 'base.html' %}

{% block title %}Lista de Clientes - ZapBombas{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12 d-flex justify-content-between align-items-center mb-4">
        <h1>Clientes Cadastrados</h1>
        <a href="/cadastro" class="btn btn-primary">+ Novo Cliente</a>
    </div>
</div>

<div class="accordion shadow-sm" id="accordionClientes">
    {% for cliente in clientes %}
    <div class="accordion-item">
        <h2 class="accordion-header" id="heading{{ cliente.id }}">
            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapse{{ cliente.id }}">
                <strong>{{ cliente.nome }}</strong>
            </button>
        </h2>
        <div id="collapse{{ cliente.id }}" class="accordion-collapse collapse" data-bs-parent="#accordionClientes">
            <div class="accordion-body">
                <p><strong>Telefone:</strong> {{ cliente.telefone }}</p>
                <p><strong>Email:</strong> {{ cliente.email }}</p>
                <div class="d-flex gap-2">
                    <a href="{{ url_for('detalhe_cliente', id=cliente.id) }}" class="btn btn-info btn-sm text-white">Ver Perfil e Histórico</a>
                    <a href="https://wa.me/55{{ cliente.telefone }}" target="_blank" class="btn btn-success btn-sm">WhatsApp</a>
                </div>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
